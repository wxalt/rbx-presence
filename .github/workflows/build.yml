name: Build Windows exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name RBXPresence --icon assets/app_icon.ico
          --add-data "assets/app_icon.ico;assets" --add-data "assets/logo_ui.png;assets"
          --exclude-module unittest --exclude-module pydoc --exclude-module doctest
          --exclude-module setuptools --exclude-module numpy --exclude-module PIL
          app.py
      - uses: actions/upload-artifact@v4
        with:
          name: RBXPresence
          path: dist/RBXPresence.exe
